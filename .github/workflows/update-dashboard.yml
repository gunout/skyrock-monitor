name: Mise à jour du dashboard Skyrock

on:
  # Toutes les heures, à la minute 5
  schedule:
    - cron: '5 * * * *'
  # Permet aussi de le lancer manuellement depuis l'onglet Actions
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      # 1. Récupérer le code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Installer Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Installer les dépendances
      - name: Installer les dépendances
        run: |
          pip install requests pandas

      # 4. Lancer le collecteur (une passe)
      - name: Collecter les nouveaux morceaux
        run: |
          python3 -c "
          import sys, os
          sys.path.insert(0, '.')
          from collecteur import test_unique
          test_unique()
          " || echo 'Collecteur en erreur, on continue'

      # 5. Générer les CSV
      - name: Générer les analyses
        run: python3 analyser.py

      # 6. Publier les CSV mis à jour
      - name: Commit des CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultats/*.csv skyrock.db 2>/dev/null || true
          git commit -m "chore: mise à jour automatique des données [skip ci]" || echo "Rien à committer"
          git push || echo "Rien à pousser"

      # 7. Déployer sur GitHub Pages
      - name: Préparer le déploiement Pages
        run: |
          mkdir -p public
          cp dashboard.html public/
          cp -r resultats public/
          touch public/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
