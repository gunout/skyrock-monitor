name: Mise à jour du dashboard

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer dépendances
        run: pip install requests pandas

      - name: Collecter (2 passes)
        run: |
          python3 -c "
          import sys, time
          sys.path.insert(0, '.')
          from collecteur import test_unique
          test_unique()
          time.sleep(30)
          test_unique()
          " || echo "Collecte échouée, on continue"

      - name: Générer CSV
        run: python3 analyser.py

      - name: Exporter JSON
        run: python3 export_json.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json resultats/*.csv skyrock.db 2>/dev/null || true
          git commit -m "chore: mise à jour auto [skip ci]" || echo "Rien à committer"
          git push || echo "Rien à pousser"

      - name: Préparer Pages
        run: |
          mkdir -p public
          cp index.html public/
          cp data.json public/ 2>/dev/null || true
          touch public/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - uses: actions/deploy-pages@v4
        id: deployment
